<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Agent — TomTom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── Playbook Design Tokens ─────────────────────────────────────────── */
    :root {
      --ui-surface-0:           #FFFFFF;
      --ui-surface-1:           #F2F2F2;
      --ui-surface-2:           #E5E5E5;
      --ui-surface-brand-red:   #DF1B12;
      --ui-text-high-em:        #000000;
      --ui-text-med-em:         #5C5C5C;
      --ui-text-low-em:         #959595;
      --ui-text-white:          #FFFFFF;
      --ui-border-low-em:       #E5E5E5;
      --ui-border-med-em:       #CCCCCC;
      --ui-radius-sm:           5px;
      --ui-radius-md:           10px;
      --ui-radius-xl:           40px;
      --ui-font-heading:        'Gilroy', 'Nunito', 'Segoe UI', sans-serif;
      --ui-font-body:           'Proxima Nova', 'Inter', 'Segoe UI', sans-serif;

      /* Virtual agent panel tokens — mapped to Playbook light-mode */
      --va-bg:                  var(--ui-surface-0);
      --va-bg-lighter:          var(--ui-surface-1);
      --va-bg-input:            var(--ui-surface-1);
      --va-text-primary:        var(--ui-text-high-em);
      --va-text-secondary:      var(--ui-text-med-em);
      --va-text-label:          var(--ui-text-low-em);
      --va-border:              var(--ui-border-low-em);
      --va-suggestion-bg:       var(--ui-surface-0);
      --va-suggestion-border:   var(--ui-border-med-em);
      --va-suggestion-hover:    var(--ui-surface-1);
      --va-msg-user-bg:         var(--ui-surface-brand-red);
      --va-msg-bot-bg:          var(--ui-surface-1);
    }

    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--ui-font-body);
      font-size: 16px;
      background: var(--ui-surface-1);
      color: var(--ui-text-high-em);
    }

    /* ─── Blank page ─────────────────────────────────────────────────────── */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page__hint {
      font-size: 0.875rem;
      color: var(--ui-text-low-em);
      text-align: center;
      user-select: none;
    }

    /* ─── Chat bubble trigger ─────────────────────────────────────────────── */
    .va-trigger {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--ui-surface-brand-red);
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(223,27,18,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      z-index: 900;
    }

    .va-trigger:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 22px rgba(223,27,18,0.45);
    }

    /* ─── Panel shell ─────────────────────────────────────────────────────── */
    .va-panel {
      position: fixed;
      background: var(--va-bg);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
      transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease;
    }

    /* Side panel — docked right */
    .va-panel--side {
      top: 0;
      right: 0;
      bottom: 0;
      width: 380px;
      border-radius: 0;
      border-left: 1px solid var(--ui-border-low-em);
      box-shadow: -2px 0 24px rgba(0,0,0,0.1);
    }

    /* Compact popup — floating bottom-right */
    .va-panel--popup {
      bottom: 88px;
      right: 28px;
      width: 380px;
      height: min(600px, 85vh);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      border: 1px solid var(--ui-border-low-em);
    }

    /* Full overlay — centred screen takeover */
    .va-panel--overlay {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(920px, 92vw);
      height: min(680px, 88vh);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    }

    /* Backdrop for overlay mode */
    .va-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      backdrop-filter: blur(2px);
    }

    /* ─── Panel header ────────────────────────────────────────────────────── */
    .va-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--va-border);
      flex-shrink: 0;
    }

    .va-header__menu {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--va-text-primary);
      cursor: pointer;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .va-header__menu:hover { background: var(--va-suggestion-hover); }

    .va-header__title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      font-family: var(--ui-font-heading);
      font-size: 1rem;
      font-weight: 700;
      color: var(--va-text-primary);
    }

    .va-header__controls {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .va-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--va-text-secondary);
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.12s, color 0.12s;
    }

    .va-icon-btn:hover {
      background: var(--va-suggestion-hover);
      color: var(--va-text-primary);
    }

    /* ─── Panel body ──────────────────────────────────────────────────────── */
    .va-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.18) transparent;
    }

    .va-body::-webkit-scrollbar { width: 4px; }
    .va-body::-webkit-scrollbar-track { background: transparent; }
    .va-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 4px; }

    /* ─── Welcome state ───────────────────────────────────────────────────── */
    .va-welcome {
      padding: 40px 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .va-welcome__icon {
      display: flex;
    }

    .va-welcome__heading {
      font-family: var(--ui-font-heading);
      font-size: 1.625rem;
      font-weight: 800;
      color: var(--va-text-primary);
      line-height: 1.25;
    }

    .va-suggested-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--va-text-label);
      text-transform: uppercase;
    }

    .va-welcome__prompt {
      font-size: 0.875rem;
      color: var(--ui-text-med-em);
      margin-top: 4px;
    }

    .va-suggestions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .va-suggestion {
      background: var(--va-suggestion-bg);
      border: 1px solid var(--va-suggestion-border);
      border-radius: var(--ui-radius-md);
      color: var(--va-text-primary);
      font-family: var(--ui-font-body);
      font-size: 0.9375rem;
      text-align: left;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      line-height: 1.4;
    }

    .va-suggestion:hover {
      background: var(--va-suggestion-hover);
      border-color: var(--ui-border-med-em);
    }

    /* ─── Conversation state ──────────────────────────────────────────────── */
    .va-conversation {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .va-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 85%;
    }

    .va-msg--bot { align-self: flex-start; }
    .va-msg--user { align-self: flex-end; }

    .va-msg__bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--ui-text-high-em);
    }

    .va-msg--bot .va-msg__bubble {
      background: var(--va-msg-bot-bg);
      border-radius: 4px 16px 16px 16px;
    }

    .va-msg--user .va-msg__bubble {
      background: var(--va-msg-user-bg);
      border-radius: 16px 16px 4px 16px;
      color: #FFFFFF;
    }

    .va-msg__sender {
      font-size: 0.75rem;
      color: var(--va-text-label);
      padding: 0 4px;
    }

    .va-msg--bot .va-msg__sender { align-self: flex-start; }
    .va-msg--user .va-msg__sender { align-self: flex-end; }

    /* Typing indicator */
    .va-typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
      background: var(--va-msg-bot-bg);
      border-radius: 4px 16px 16px 16px;
      align-self: flex-start;
      width: fit-content;
    }

    .va-typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--va-text-secondary);
      animation: va-bounce 1.2s infinite ease-in-out;
    }

    .va-typing span:nth-child(2) { animation-delay: 0.2s; }
    .va-typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes va-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── Panel footer ────────────────────────────────────────────────────── */
    .va-footer {
      flex-shrink: 0;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--va-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .va-input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--va-bg-input);
      border: 1px solid var(--va-border);
      border-radius: var(--ui-radius-md);
      padding: 10px 10px 10px 14px;
      transition: border-color 0.15s;
    }

    .va-input-row:focus-within {
      border-color: var(--ui-surface-brand-red);
    }

    .va-input-row textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--va-text-primary);
      font-family: var(--ui-font-body);
      font-size: 0.9375rem;
      line-height: 1.5;
      min-height: 24px;
      max-height: 120px;
      overflow-y: auto;
    }

    .va-input-row textarea::placeholder {
      color: var(--va-text-secondary);
    }

    .va-send {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--ui-surface-brand-red);
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.12s;
    }

    .va-send:hover {
      background: #c41710;
      transform: scale(1.06);
    }

    .va-disclaimer {
      font-size: 0.75rem;
      color: var(--va-text-label);
      text-align: center;
    }

    /* ─── Overlay mode: wider layout adjusts welcome padding ─────────────── */
    .va-panel--overlay .va-welcome {
      padding: 56px 64px 32px;
      max-width: 640px;
    }

    .va-panel--overlay .va-welcome__heading {
      font-size: 2rem;
    }

    .va-panel--overlay .va-conversation {
      padding: 32px 64px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .va-panel--overlay .va-footer {
      padding: 16px 64px 18px;
    }
  </style>
</head>
<body>

  <!-- ── Blank page ───────────────────────────────────────────────────────── -->
  <div class="page">
    <p class="page__hint">Click the chat button → to open the virtual agent</p>
  </div>

  <!-- ── Backdrop (overlay mode only) ────────────────────────────────────── -->
  <div class="va-backdrop" id="va-backdrop" hidden></div>

  <!-- ── Chat bubble trigger ──────────────────────────────────────────────── -->
  <button class="va-trigger" id="va-trigger" aria-label="Open virtual agent">
    <!-- Sparkle / chat icon -->
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3C7.03 3 3 6.8 3 11.5c0 2.1.82 4.02 2.17 5.5L4 21l4.37-1.4A9.3 9.3 0 0 0 12 20c4.97 0 9-3.8 9-8.5S16.97 3 12 3Z" fill="currentColor" opacity=".9"/>
      <path d="M9.5 10.5h5M9.5 13.5h3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- ── Virtual agent panel ──────────────────────────────────────────────── -->
  <div class="va-panel va-panel--side" id="va-panel" hidden role="dialog" aria-label="Virtual agent">

    <!-- Header -->
    <div class="va-header">
      <button class="va-header__menu va-icon-btn" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="va-header__title">
        <!-- TomTom logo mark -->
        <svg width="14" height="20" viewBox="0 0 16.574 24.0001" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M8.28764 24.0001L11.4639 18.5139H5.11133L8.28764 24.0001Z" fill="#DF1B12"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M8.28694 12.5839C5.89835 12.5839 3.95522 10.6459 3.95522 8.26409C3.95522 5.88209 5.89835 3.94415 8.28694 3.94415C10.6755 3.94415 12.6187 5.88209 12.6187 8.26409C12.6187 10.6459 10.6755 12.5839 8.28694 12.5839M8.28694 0C3.7175 0 0 3.70725 0 8.26409C0 12.8208 3.7175 16.528 8.28694 16.528C12.8564 16.528 16.5739 12.8208 16.5739 8.26409C16.5739 3.70725 12.8564 0 8.28694 0" fill="#DF1B12"/>
        </svg>
        Help Center Support
      </div>

      <div class="va-header__controls">
        <!-- Expand to overlay -->
        <button class="va-icon-btn" id="va-btn-expand" aria-label="Expand to full screen" title="Expand">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10 2h4v4M14 2l-5 5M6 14H2v-4M2 14l5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <!-- Collapse to side panel (shown in overlay mode) -->
        <button class="va-icon-btn" id="va-btn-collapse" aria-label="Collapse to side panel" title="Collapse" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 2H2v4M2 2l5 5M10 14h4v-4M14 14l-5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <!-- Compact popup toggle -->
        <button class="va-icon-btn" id="va-btn-popup" aria-label="Compact popup" title="Compact view">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1.5" y="2.5" width="5.5" height="11" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="9" y="2.5" width="5.5" height="11" rx="1" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <!-- Minimise / close -->
        <button class="va-icon-btn" id="va-btn-close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Body: welcome state -->
    <div class="va-body" id="va-body">

      <div class="va-welcome" id="va-welcome">
        <h2 class="va-welcome__heading">Hello! How can I help you today?</h2>
        <p class="va-suggested-label">Suggested</p>
        <div class="va-suggestions">
          <button class="va-suggestion" data-action="create-case">
            I want to create a support case for myself
          </button>
          <button class="va-suggestion" data-action="ask-question">
            I have a question, can you help me find the answer?
          </button>
          <button class="va-suggestion" data-action="browse-topics">
            See suggestion of topics to ask
          </button>
        </div>
        <p class="va-welcome__prompt">Or type what you need help with in the field below.</p>
      </div>

      <!-- Conversation state (hidden by default) -->
      <div class="va-conversation" id="va-conversation" hidden></div>

    </div>

    <!-- Footer -->
    <div class="va-footer">
      <div class="va-input-row">
        <textarea
          id="va-input"
          placeholder="Ask a question…"
          rows="1"
          aria-label="Your message"
        ></textarea>
        <button class="va-send" id="va-send" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="va-disclaimer">Answers generated by AI. Check for accuracy.</p>
    </div>

  </div><!-- /va-panel -->

  <script>
    const trigger     = document.getElementById('va-trigger');
    const panel       = document.getElementById('va-panel');
    const backdrop    = document.getElementById('va-backdrop');
    const btnExpand   = document.getElementById('va-btn-expand');
    const btnCollapse = document.getElementById('va-btn-collapse');
    const btnPopup    = document.getElementById('va-btn-popup');
    const btnClose    = document.getElementById('va-btn-close');
    const welcome     = document.getElementById('va-welcome');
    const convo       = document.getElementById('va-conversation');
    const input       = document.getElementById('va-input');
    const sendBtn     = document.getElementById('va-send');

    let isOverlay = false;
    let isPopup   = false;

    // ── Open / close ────────────────────────────────────────────────────────
    function openPanel() {
      panel.hidden = false;
      trigger.hidden = true;
    }

    function closePanel() {
      panel.hidden = true;
      backdrop.hidden = true;
      trigger.hidden = false;
      if (isOverlay) exitOverlay();
    }

    trigger.addEventListener('click', openPanel);
    btnClose.addEventListener('click', closePanel);
    backdrop.addEventListener('click', closePanel);

    // ── Expand / collapse overlay ────────────────────────────────────────────
    function enterOverlay() {
      isOverlay = true;
      if (isPopup) exitPopup(false);
      panel.classList.replace('va-panel--side', 'va-panel--overlay');
      backdrop.hidden = false;
      btnExpand.hidden = true;
      btnCollapse.hidden = false;
    }

    function exitOverlay() {
      isOverlay = false;
      panel.classList.replace('va-panel--overlay', 'va-panel--side');
      backdrop.hidden = true;
      btnExpand.hidden = false;
      btnCollapse.hidden = true;
    }

    btnExpand.addEventListener('click', enterOverlay);
    btnCollapse.addEventListener('click', exitOverlay);

    // ── Compact popup toggle ─────────────────────────────────────────────────
    function enterPopup() {
      isPopup = true;
      panel.classList.replace('va-panel--side', 'va-panel--popup');
      trigger.hidden = true;
    }

    function exitPopup(restoreTrigger = true) {
      isPopup = false;
      panel.classList.replace('va-panel--popup', 'va-panel--side');
      if (restoreTrigger) trigger.hidden = true; // panel still open, trigger stays hidden
    }

    btnPopup.addEventListener('click', () => {
      if (isOverlay) exitOverlay();
      isPopup ? exitPopup() : enterPopup();
    });

    // ── Suggestion actions ───────────────────────────────────────────────────
    const TOPIC_SUGGESTIONS = [
      'The map data in my application looks incorrect or outdated.',
      'How do I find or regenerate my API key?',
      'I\'m hitting my API request limit. How do I increase it?',
      'Which SDK or API is best for my use case?',
      'I need help integrating the Routing or Search API.',
    ];

    function appendMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `va-msg va-msg--${type}`;
      const sender = document.createElement('span');
      sender.className = 'va-msg__sender';
      sender.textContent = type === 'bot' ? 'Help Center Support' : 'You';
      const bubble = document.createElement('div');
      bubble.className = 'va-msg__bubble';
      bubble.innerHTML = text;
      msg.appendChild(sender);
      msg.appendChild(bubble);
      convo.appendChild(msg);
      convo.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }

    function showTyping() {
      const t = document.createElement('div');
      t.className = 'va-typing';
      t.id = 'va-typing';
      t.innerHTML = '<span></span><span></span><span></span>';
      convo.appendChild(t);
      convo.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }

    function removeTyping() {
      const t = document.getElementById('va-typing');
      if (t) t.remove();
    }

    function enterConversation() {
      welcome.hidden = true;
      convo.hidden = false;
      convo.innerHTML = '';
    }

    function handleSuggestion(action) {
      if (action === 'create-case') {
        window.location.href = 'help-center-record-producer.html';
        return;
      }

      enterConversation();

      if (action === 'ask-question') {
        appendMessage('I have a question, can you help me find the answer?', 'user');
        showTyping();
        setTimeout(() => {
          removeTyping();
          appendMessage("Of course! Go ahead and type your question below and I'll do my best to help.", 'bot');
        }, 1200);
        return;
      }

      if (action === 'browse-topics') {
        appendMessage('See suggestion of topics to ask', 'user');
        showTyping();
        setTimeout(() => {
          removeTyping();
          const list = TOPIC_SUGGESTIONS.map(t => `<li style="margin:6px 0;">${t}</li>`).join('');
          appendMessage(`Here are some common topics you can ask me about:<ul style="margin-top:10px;padding-left:18px;line-height:1.6;">${list}</ul>`, 'bot');
        }, 1200);
      }
    }

    document.querySelectorAll('.va-suggestion').forEach(btn => {
      btn.addEventListener('click', () => handleSuggestion(btn.dataset.action));
    });

    // ── Send message from input ──────────────────────────────────────────────
    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = 'auto';
      if (!welcome.hidden) enterConversation();
      appendMessage(text, 'user');
      showTyping();
      setTimeout(() => {
        removeTyping();
        appendMessage("Thanks for your message. I'm looking into that for you — one moment.", 'bot');
      }, 1400);
    }

    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // Auto-grow textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    });
  </script>

</body>
</html>
